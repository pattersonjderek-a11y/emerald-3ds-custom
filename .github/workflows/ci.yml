name: CI

on:
  push:
  pull_request:

jobs:
  audit-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.17"
      - run: pip install Pillow==12.3.0
      - name: Publication audit
        run: python tools/release_audit.py --repo . --strict
      - name: Byte-compile all Python
        run: python -m compileall -q builder tools 3ds_port/scripts 3ds_port/tests
      - name: Builder tests (synthetic data, no ROM)
        run: python -m unittest discover -s builder/tests -v
      - name: Synthetic web payload passes the release contract audit
        run: |
          python tools/build_web_payload.py --synthetic synthetic-web
          python tools/release_audit.py --zip synthetic-web/Emerald3DS-WebPayload.zip --strict --web-payload

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.17"
      - name: Data pack parser against the builder's writer
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror -I3ds_port/include \
              3ds_port/tests/pak_test.c 3ds_port/src/3ds_pak.c -o pak_test
          ./pak_test test.pak "$(python 3ds_port/tests/make_test_pak.py test.pak)"
      - name: Input and video decoding
        run: |
          cd 3ds_port
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Iinclude tests/input_test.c src/3ds_input_decode.c -o input_test && ./input_test
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Iinclude tests/video_decode_test.c src/3ds_video_decode.c -o video_test && ./video_test
      - name: Day/night clock and lighting
        run: make -C 3ds_port verify-daynight verify-clock-store verify-encounters verify-night-lamps
      - name: Standalone voxel shadows and mesh fixtures
        run: |
          make -C 3ds_port verify-voxel-lighting verify-voxel-trees build/voxel_ground_mesh_test.exe
          cd 3ds_port
          ./build/voxel_ground_mesh_test.exe
      - name: Night window masks and building-page compatibility
        run: |
          python -m pip install Pillow
          python 3ds_port/tests/voxel_night_test.py --cc gcc
      - name: Bottom map and clock footer
        run: python 3ds_port/tests/bottom_map_test.py
      - name: Production payload padding and constrained heap reclamation
        run: python 3ds_port/tests/asset_memory_test.py

  build-3ds:
    strategy:
      fail-fast: false
      matrix:
        include:
          - upstream: pokeemerald
            tree: upstream
          - upstream: pokeemerald-expansion
            tree: expansion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce the tested SDK and generator image
        run: |
          docker build -f tools/stage_a.Dockerfile -t emerald-stage-a-sdk .
          docker build -f tools/stage_e.Dockerfile -t emerald-stage-e-v050-sdk .
          docker run -d --user "$(id -u):$(id -g)" --name emerald-ci -v "$GITHUB_WORKSPACE:/workspace/emerald-3ds-stage-e" emerald-stage-e-v050-sdk sleep infinity
      - name: Bootstrap and build
        run: |
          docker exec -i emerald-ci bash -se <<'CHECK'
          python3 -m py_compile tools/port_common/gen_asset_table.py
          python3 builder/tests/test_asset_table_compatibility.py
          python3 tools/bootstrap.py --upstream ${{ matrix.upstream }} --dir build/${{ matrix.tree }} --make -j4 --python python3
          CHECK
      - name: Host tests and link audit
        run: |
          docker exec -i emerald-ci bash -se <<'CHECK'
          make -C build/${{ matrix.tree }}/3ds_port verify PYTHON=python3
          CHECK
      - name: Expansion gameplay settings regression fixtures
        if: matrix.upstream == 'pokeemerald-expansion'
        run: |
          docker exec -i emerald-ci bash -se <<'CHECK'
          python3 -m unittest builder.tests.test_expansion_enhancements -v
          CHECK
      - name: Production timed encounter rules
        if: matrix.upstream == 'pokeemerald'
        run: |
          docker exec -i emerald-ci bash -se <<'CHECK'
          python3 3ds_port/tests/encounter_tables_test.py --tree build/${{ matrix.tree }}
          CHECK
      - name: Custom fixed campaign and private installer checks
        if: matrix.upstream == 'pokeemerald-expansion'
        run: |
          docker exec -i emerald-ci bash -se <<'CHECK'
          export EMERALD3DS_EXPANSION_TREE="$PWD/build/expansion"
          python3 -m unittest builder.tests.test_campaign_policy builder.tests.test_custom_package builder.tests.test_pak_validation builder.tests.test_package_evidence -v
          python3 tools/campaign_audit.py --tree build/expansion --gdb /opt/devkitpro/devkitARM/bin/arm-none-eabi-gdb --output work/stage-f-campaign.json
          CHECK
      - name: Production berry clock integration
        if: matrix.upstream == 'pokeemerald'
        run: |
          docker exec -i emerald-ci bash -se <<'CHECK'
          python3 3ds_port/tests/berry_clock_test.py --tree build/${{ matrix.tree }}
          CHECK
      - name: Engine-only 3DSX
        run: |
          docker exec -i emerald-ci bash -se <<'CHECK'
          make -C build/${{ matrix.tree }}/3ds_port release PYTHON=python3
          CHECK
      - name: Expansion graphics decoded against their native raw inputs
        if: matrix.upstream == 'pokeemerald-expansion'
        run: |
          docker exec -i emerald-ci bash -se <<'CHECK'
          make -C build/expansion/3ds_port pak PYTHON=python3
          python3 3ds_port/tests/intro_asset_decode_test.py --tree build/expansion --pak build/expansion/3ds_port/build/emerald3ds.pak
          CHECK
      - name: Audit the build outputs that would ship
        run: |
          mkdir -p ship && cp build/${{ matrix.tree }}/3ds_port/dist/Emerald3DS.3dsx build/${{ matrix.tree }}/3ds_port/dist/Emerald3DS.smdh ship/
          # In payload/, where the release ships them (release_audit_allow.toml [large]).
          python3 -c "import zipfile,pathlib; z=zipfile.ZipFile('ship.zip','w'); [z.write(p, 'payload/' + p.name) for p in pathlib.Path('ship').iterdir()]"
          python3 tools/release_audit.py --zip ship.zip --strict
      - uses: actions/upload-artifact@v4
        with:
          name: emerald3ds-engine-${{ matrix.tree }}
          path: ship/
